name: GitHub Pages

# Veröffentlicht die statische Seite und erzeugt dabei stündlich einen Snapshot der Preisdaten
# (data/prices.json) als letzten Fallback für den Browser. Voraussetzung: Settings → Pages → Source „GitHub Actions“.

on:
  push:
    # Standard-Branch dieses Repositories (bei Umbenennung auf main anpassen)
    branches: [main, ccr-44d3aa6b-g7gd63]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Zuletzt veröffentlichten Snapshot als Rückfalloption holen
        run: |
          mkdir -p data
          curl -fsSL --max-time 30 "${{ steps.pages.outputs.base_url }}/data/prices.json" -o data/prices.json \
            && echo "Vorheriger Snapshot übernommen" || echo "Kein vorheriger Snapshot vorhanden"
      - name: Snapshot der Preisdaten erzeugen (fehlertolerant, überschreibt nur bei Erfolg)
        run: node scripts/fetch-snapshot.js --tolerant
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html assets src LICENSE _site/
          if [ -f data/prices.json ]; then mkdir -p _site/data && cp data/prices.json _site/data/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
